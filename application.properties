# ---------- Server ----------
server.port=8080

# ---------- Database: H2 embedded file database (no installation needed) ----------
# The file is created on first start at backend/data/medibook.mv.db (relative to the backend folder).
# Delete the backend/data folder to reset all data.
spring.datasource.url=jdbc:h2:file:./data/medibook
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 web console (local use only): http://localhost:8080/h2-console
# JDBC URL: jdbc:h2:file:./data/medibook   User: sa   Password: (empty)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# ---------- Application ----------
app.timezone=Asia/Kolkata
app.security.secret=${APP_SECRET:change-this-secret-before-deploying-medibook-2026}
app.security.token-hours=24
# Origins (patterns) allowed to call the API directly from a browser.
# Needed because the Vite dev server forwards the browser's Origin header to the backend.
app.cors.allowed-origins=http://localhost:*,http://127.0.0.1:*
app.admin.email=admin@medibook.com
app.admin.password=Admin@123
app.seed-demo-data=true
